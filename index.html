<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fce4ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor principal de la carta */
        .card-container {
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 320px;
            height: 420px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-radius: 15px;
        }

        .card.open {
            transform: rotateY(-180deg);
        }

        /* Caras del sobre / carta */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
        }

        /* Frente (Sobre de la carta) */
        .card-front {
            background: linear-gradient(135deg, #ff80ab, #ff4081);
            color: white;
            border: 3px solid #fff;
        }

        .card-front h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .card-front p {
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            margin-top: 15px;
        }

        .tulip-icon {
            font-size: 60px;
            margin: 10px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Interior de la carta */
        .card-back {
            background-color: #ffffff;
            color: #4a4a4a;
            transform: rotateY(180deg);
            border: 2px solid #f48fb1;
            position: relative;
            overflow: hidden;
        }

        /* Ilustraciones de tulipanes en los bordes */
        .card-back::before {
            content: "🌷 🌷 🌷";
            position: absolute;
            top: 10px;
            font-size: 22px;
        }

        .card-back::after {
            content: "🌷 🌷 🌷";
            position: absolute;
            bottom: 10px;
            font-size: 22px;
        }

        .card-back h1 {
            color: #d81b60;
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-family: 'Georgia', serif;
        }

        .card-back p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px;
        }

        /* Lluvia de tulipanes al abrir */
        .floating-tulip {
            position: absolute;
            top: -50px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card-container" onclick="openCard()">
        <div class="card" id="card">
            <!-- Portada de la carta -->
            <div class="card-front">
                <h2>Tienes un mensaje especial</h2>
                <div class="tulip-icon">🌷</div>
                <p>✨ Haz clic para abrir ✨</p>
            </div>

            <!-- Contenido interior -->
            <div class="card-back">
                <h1>¡Feliz Cumpleaños! 🎉</h1>
                <p>
                    Deseo que este nuevo año de vida esté lleno de alegría, amor, salud y momentos tan hermosos como un jardín repleto de tulipanes.
                </p>
                <p style="font-weight: bold; color: #ad1457;">
                    ¡Que tengas un día inolvidable! 🌷✨
                </p>
            </div>
        </div>
    </div>

    <script>
        let isOpen = false;

        function openCard() {
            const card = document.getElementById('card');
            card.classList.toggle('open');
            isOpen = !isOpen;

            if (isOpen) {
                // Crear efecto de lluvia de tulipanes al abrir
                for (let i = 0; i < 25; i++) {
                    setTimeout(createTulip, i * 120);
                }
            }
        }

        function createTulip() {
            const tulip = document.createElement('div');
            tulip.classList.add('floating-tulip');
            
            // Variedad de flores o tulipanes
            const flowers = ['🌷', '🌸', '🌷', '🌺'];
            tulip.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            
            tulip.style.left = Math.random() * 100 + 'vw';
            tulip.style.animationDuration = Math.random() * 3 + 2 + 's';
            tulip.style.opacity = Math.random();
            tulip.style.fontSize = Math.random() * 15 + 20 + 'px';

            document.body.appendChild(tulip);

            setTimeout(() => {
                tulip.remove();
            }, 5000);
        }
    </script>
</body>
</html>
